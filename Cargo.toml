[package]
name = "scavnet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28.1"
hound = "3.5.1"
rand = "0.9"
ratatui = "0.29.0"
rodio = { version = "0.20.1", features = ["noise"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
spectrum-analyzer = "1.6.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = true
