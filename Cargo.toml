[package]
name = "scavnet"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
hound = "3.5.1"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "hound", "noise"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["serialize", "deserialize"] }
spectrum-analyzer = "2.0.0"
toml = "1.2.1"
serde_json = { version = "1.0.154", optional = true }
ureq = { version = "3.5.1", optional = true, features = ["json"] }

[features]
# Offline authoring with OpenAI: `cargo run --features generate -- generate --help`
generate = ["dep:ureq", "dep:serde_json"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
debug = true
