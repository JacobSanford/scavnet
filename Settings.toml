# Every key is optional; unknown keys are errors. Relative paths resolve against this file.
debug = false
# seed = 42            # fixed seed for reproducible runs

[paths]
data_dir = "data"                        # git-tracked world
networks = "networks.yaml"               # relative to data_dir
library = "transmissions/sets.yaml"      # relative to data_dir
state_dir = "state"                      # playback progress (gitignored)
cache_dir = "cache"                      # spectrum cache (gitignored, safe to delete)

[display]
redraw_hz = 30

[scanner]
frequencies_per_second = 80000

[timings]                                # seconds
first_transmission = { min = 3.0, max = 10.0 }   # after startup
transmission_gap = { min = 120.0, max = 240.0 }   # after each airing
hiss_preroll = { min = 0.7, max = 1.1 }
hiss_postroll = { min = 0.5, max = 2.0 }

[volumes]
transmission = 1.0
hiss = 0.05
